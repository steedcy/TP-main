spring:
  application:
    name: airport-ai-app

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:airport_ai}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AirportAiHikariPool
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      connection-test-query: SELECT 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: 8080

# 会话空闲30分钟失效，对应SRS_NF002
app:
  demo-reset:
    enabled: ${DEMO_RESET_ENABLED:false}
  session:
    idle-timeout-minutes: 30
  auth:
    max-failed-attempts: 3
  device:
    heartbeat-timeout-seconds: 30
    command-timeout-seconds: 60
    adapter-connect-timeout-ms: 2000
    adapter-read-timeout-ms: 3000
    adapter-public-base-url: ${DEVICE_PLATFORM_BASE_URL:http://localhost:8080}
    max-access-objects-demo: 10
    max-access-objects-system: 20
    credential-encryption-key: ${DEVICE_CREDENTIAL_ENCRYPTION_KEY:}
  situation:
    refresh-interval-seconds: 5
    refresh-interval-max-seconds: 15
  task:
    max-steps: 5
    max-replan-count: 1
    step-timeout-default-seconds: 60
  context:
    fault-injection:
      failed-agent-codes: ${APP_CONTEXT_FAULT_INJECTION_FAILED_AGENT_CODES:}
  risk:
    low-confidence-threshold: 0.8
    context-stale-seconds: 60
    resource-critical-candidate-threshold: 1
  planning-model:
    provider: ${PLANNING_MODEL_PROVIDER:external}
    endpoint: ${PLANNING_MODEL_ENDPOINT:}
    api-key: ${PLANNING_MODEL_API_KEY:}
    timeout-ms: 60000
    moonshot:
      base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
      api-key: ${MOONSHOT_API_KEY:}
      model: ${MOONSHOT_MODEL:kimi-k2.6}
      max-tokens: ${MOONSHOT_MAX_TOKENS:4096}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.airport.ai: INFO

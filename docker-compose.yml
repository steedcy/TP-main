services:
  postgres:
    image: postgres:15-alpine
    container_name: airport-ai-postgres
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: ${DB_NAME:-airport_ai}
      POSTGRES_USER: ${DB_USERNAME:-airportai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请先配置 .env 中的 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-airportai_user} -d ${DB_NAME:-airport_ai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: airport-ai-redis
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请先配置 .env 中的 REDIS_PASSWORD}
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: ${BACKEND_DOCKERFILE:-docker/backend/Dockerfile}
    image: airport-ai-backend:latest
    container_name: airport-ai-backend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-airport_ai}
      DB_USERNAME: ${DB_USERNAME:-airportai_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEVICE_CREDENTIAL_ENCRYPTION_KEY: ${DEVICE_CREDENTIAL_ENCRYPTION_KEY:?请先配置 DEVICE_CREDENTIAL_ENCRYPTION_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      APP_CORS_ALLOW_LOCALHOST_PATTERNS: ${APP_CORS_ALLOW_LOCALHOST_PATTERNS:-true}
      DEVICE_PLATFORM_BASE_URL: http://127.0.0.1:8080
      DEVICE_SIMULATOR_MANAGEMENT_ENABLED: "true"
      DEVICE_SIMULATOR_JAR: /app/device-simulator-runtime.jar
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
      PLANNING_MODEL_PROVIDER: ${PLANNING_MODEL_PROVIDER:-moonshot}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-kimi-k2.6}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PLANNING_FALLBACK_ENABLED: ${PLANNING_FALLBACK_ENABLED:-false}
      PLANNING_ACTIVE_MODE: ${PLANNING_ACTIVE_MODE:-SECONDARY_ONLY}
      FALLBACK_MODEL_BASE_URL: ${FALLBACK_MODEL_BASE_URL:-https://ai.axuremart.com/v1}
      FALLBACK_MODEL_NAME: ${FALLBACK_MODEL_NAME:-gpt-sonnet-6.1}
      FALLBACK_MODEL_API_KEY: ${FALLBACK_MODEL_API_KEY:-}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-https://ai.axuremart.com/v1}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-gpt-sonnet-6.1}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      PLANNING_MODEL_ENDPOINT: ${PLANNING_MODEL_ENDPOINT:-}
      PLANNING_MODEL_API_KEY: ${PLANNING_MODEL_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ${FRONTEND_DOCKERFILE:-docker/frontend/Dockerfile}
    image: airport-ai-frontend:latest
    container_name: airport-ai-frontend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
